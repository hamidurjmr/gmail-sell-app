<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>GmailSell - Earn $1.20 per Gmail</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        .login-box {
            background: white;
            border-radius: 48px;
            padding: 48px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .logo-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: float 3s ease-in-out infinite;
        }

        .logo-icon i {
            font-size: 48px;
            color: white;
        }

        .login-box h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .google-login-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 100px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .google-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }

        .google-login-btn:active {
            transform: translateY(0);
        }

        .referral-note {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #667eea;
            font-size: 13px;
            font-weight: 500;
        }

        /* Dashboard */
        .dashboard {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            padding-bottom: 80px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        /* Header */
        .app-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            animation: slideInLeft 0.5s ease;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 6px 12px 6px 6px;
            border-radius: 60px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .user-badge:hover {
            transform: scale(1.05);
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .user-avatar:hover {
            transform: rotate(360deg);
        }

        /* Balance Cards */
        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }

        .balance-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
            animation-fill-mode: both;
        }

        .balance-card:nth-child(1) { animation-delay: 0.1s; }
        .balance-card:nth-child(2) { animation-delay: 0.2s; }
        .balance-card:nth-child(3) { animation-delay: 0.3s; }

        .balance-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .balance-card.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, #667eea, #764ba2);
            position: relative;
            overflow: hidden;
        }

        .balance-card.full-width::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s infinite;
        }

        .balance-card.full-width .label,
        .balance-card.full-width .value {
            color: white;
        }

        .balance-card .label {
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-card .value {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            transition: all 0.3s ease;
        }

        /* Section Card */
        .section-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin: 0 16px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
        }

        .section-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form */
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-size: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
            transform: scale(1.01);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102,126,234,0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* List Items */
        .list-item {
            background: #f8fafc;
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            animation: fadeInUp 0.3s ease;
        }

        .list-item:hover {
            transform: translateX(5px);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102,126,234,0.1);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
            animation: pulse 2s infinite;
        }

        .status-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Referral Box */
        .referral-box {
            background: linear-gradient(135deg, #fef9c3, #fde047);
            border-radius: 28px;
            padding: 20px;
            margin: 0 16px 16px;
            animation: float 3s ease-in-out infinite;
        }

        .copy-container {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .copy-container input {
            flex: 1;
            background: white;
            border: none;
            padding: 12px;
            border-radius: 60px;
            font-size: 12px;
        }

        .copy-btn {
            background: #854d0e;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            transform: scale(1.05);
            background: #b45309;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            border-radius: 28px 28px 0 0;
            z-index: 100;
            animation: slideInUp 0.5s ease;
        }

        @keyframes slideInUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            transition: all 0.3s ease;
        }

        .nav-tab i {
            font-size: 22px;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .nav-tab span {
            font-size: 11px;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .nav-tab.active i,
        .nav-tab.active span {
            color: #667eea;
        }

        .nav-tab.active {
            background: #f1f5f9;
            transform: translateY(-5px);
        }

        /* Floating Logout */
        .floating-logout {
            position: fixed;
            bottom: 90px;
            right: 16px;
            background: #ef4444;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239,68,68,0.3);
            transition: all 0.3s ease;
            z-index: 99;
            animation: bounceIn 0.5s ease;
        }

        .floating-logout:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(239,68,68,0.4);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 80px;
            left: 16px;
            right: 16px;
            background: #10b981;
            color: white;
            padding: 14px 20px;
            border-radius: 60px;
            display: none;
            text-align: center;
            z-index: 200;
            font-weight: 500;
            animation: slideInUp 0.3s ease;
        }

        .toast.error {
            background: #ef4444;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <div class="logo-icon">
            <i class="fas fa-envelope"></i>
        </div>
        <h1>GmailSell</h1>
        <p>Sell Gmail accounts • Earn $1.20 each</p>
        <button id="googleLoginBtn" class="google-login-btn">
            <i class="fab fa-google"></i> Sign in with Google
        </button>
        <div class="referral-note">
            <i class="fas fa-gift"></i> Refer & earn $0.10 per referral
        </div>
    </div>
</div>

<div id="dashboard" class="dashboard">
    <div class="app-header">
        <h1>GmailSell</h1>
        <div class="user-badge">
            <div class="user-avatar" id="userAvatar">U</div>
            <span id="userName">User</span>
        </div>
    </div>

    <div class="balance-grid">
        <div class="balance-card full-width">
            <div class="label"><i class="fas fa-wallet"></i> Your Balance</div>
            <div class="value" id="balance">$0.00</div>
        </div>
        <div class="balance-card">
            <div class="label"><i class="fas fa-dollar-sign"></i> Price/Gmail</div>
            <div class="value">$1.20</div>
        </div>
        <div class="balance-card">
            <div class="label"><i class="fas fa-chart-line"></i> Total Earned</div>
            <div class="value" id="totalEarned">$0.00</div>
        </div>
    </div>

    <div id="sellTab" class="tab-pane active">
        <div class="section-card">
            <div class="section-title"><i class="fas fa-envelope"></i> Sell Gmail Account</div>
            <form id="sellForm">
                <input type="email" id="gmailEmail" class="form-input" placeholder="Gmail address" required>
                <input type="password" id="gmailPassword" class="form-input" placeholder="Password" required>
                <button type="submit" class="btn-primary" id="sellBtn"><i class="fas fa-rocket"></i> Sell Now - $1.20</button>
            </form>
        </div>
    </div>

    <div id="historyTab" class="tab-pane">
        <div class="section-card">
            <div class="section-title"><i class="fas fa-history"></i> Sales History</div>
            <div id="salesList"></div>
        </div>
    </div>

    <div id="withdrawTab" class="tab-pane">
        <div class="section-card">
            <div class="section-title"><i class="fab fa-bitcoin"></i> Withdraw Funds</div>
            <form id="withdrawForm">
                <input type="text" id="btcAddress" class="form-input" placeholder="Bitcoin wallet address" required>
                <input type="number" id="withdrawAmount" class="form-input" placeholder="Amount (Min $29)" step="0.01" required>
                <button type="submit" class="btn-primary" id="withdrawBtn"><i class="fas fa-paper-plane"></i> Request Withdrawal</button>
            </form>
        </div>
        <div class="section-card">
            <div class="section-title"><i class="fas fa-list"></i> Withdrawal History</div>
            <div id="withdrawList"></div>
        </div>
    </div>

    <div id="referralsTab" class="tab-pane">
        <div class="referral-box">
            <p><i class="fas fa-gift"></i> Share this link & earn $0.10 per referral!</p>
            <div class="copy-container">
                <input type="text" id="referralLink" readonly>
                <button id="copyLinkBtn" class="copy-btn">Copy</button>
            </div>
        </div>
        <div class="section-card">
            <div class="section-title"><i class="fas fa-users"></i> Your Referrals</div>
            <div id="referralsList"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-tab active" data-tab="sell"><i class="fas fa-dollar-sign"></i><span>Sell</span></button>
        <button class="nav-tab" data-tab="history"><i class="fas fa-history"></i><span>History</span></button>
        <button class="nav-tab" data-tab="withdraw"><i class="fab fa-bitcoin"></i><span>Withdraw</span></button>
        <button class="nav-tab" data-tab="referrals"><i class="fas fa-users"></i><span>Refer</span></button>
    </div>

    <button id="logoutBtn" class="floating-logout"><i class="fas fa-sign-out-alt"></i></button>
</div>

<div id="toast" class="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBChVfSCJhhxhDgXWM5x3ryrwYtVZmwSmc",
        authDomain: "sellapp-66d68.firebaseapp.com",
        projectId: "sellapp-66d68",
        storageBucket: "sellapp-66d68.firebasestorage.app",
        messagingSenderId: "478211272161",
        appId: "1:478211272161:web:ed55d6c8b366a192ba36a0"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = isError ? 'toast error' : 'toast';
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.animation = 'slideInUp 0.3s reverse';
            setTimeout(() => {
                toast.style.display = 'none';
                toast.style.animation = '';
            }, 300);
        }, 3000);
    }

    // Real-time user balance listener
    function listenUserBalance(userId) {
        db.collection('users').doc(userId).onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const balanceEl = document.getElementById('balance');
                const earnedEl = document.getElementById('totalEarned');
                balanceEl.innerHTML = `$${(data.balance || 0).toFixed(2)}`;
                earnedEl.innerHTML = `$${(data.totalEarned || 0).toFixed(2)}`;
                
                // Add animation on balance update
                balanceEl.style.animation = 'pulse 0.3s ease';
                earnedEl.style.animation = 'pulse 0.3s ease';
                setTimeout(() => {
                    balanceEl.style.animation = '';
                    earnedEl.style.animation = '';
                }, 300);
            }
        });
    }

    // Real-time sales history
    function listenSalesHistory(userId) {
        db.collection('gmailSales')
            .where('userId', '==', userId)
            .orderBy('createdAt', 'desc')
            .onSnapshot((snapshot) => {
                const div = document.getElementById('salesList');
                if (snapshot.empty) {
                    div.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No sales yet</p><p style="font-size:12px">Sell your first Gmail to get started!</p></div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const sale = doc.data();
                    const date = sale.createdAt ? sale.createdAt.toDate().toLocaleString() : 'Just now';
                    let statusClass = '';
                    let statusText = '';
                    
                    if (sale.status === 'approved') {
                        statusClass = 'status-approved';
                        statusText = `✅ Approved +$${sale.amount}`;
                    } else if (sale.status === 'rejected') {
                        statusClass = 'status-rejected';
                        statusText = `❌ Rejected: ${sale.rejectionReason || 'No reason'}`;
                    } else {
                        statusClass = 'status-pending';
                        statusText = '⏳ Pending Verification';
                    }
                    
                    html += `
                        <div class="list-item">
                            <div>
                                <p><strong>${sale.gmailEmail}</strong></p>
                                <p style="font-size:12px;color:#64748b;"><i class="far fa-calendar-alt"></i> ${date}</p>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    `;
                });
                div.innerHTML = html;
            });
    }

    // Real-time withdrawal history
    function listenWithdrawHistory(userId) {
        db.collection('withdrawals')
            .where('userId', '==', userId)
            .orderBy('createdAt', 'desc')
            .onSnapshot((snapshot) => {
                const div = document.getElementById('withdrawList');
                if (snapshot.empty) {
                    div.innerHTML = '<div class="empty-state"><i class="fas fa-receipt"></i><p>No withdrawals yet</p><p style="font-size:12px">Request your first withdrawal when balance reaches $29</p></div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const wd = doc.data();
                    const date = wd.createdAt ? wd.createdAt.toDate().toLocaleString() : 'Just now';
                    let statusClass = '';
                    let statusText = '';
                    
                    if (wd.status === 'completed') {
                        statusClass = 'status-approved';
                        statusText = '✅ Completed';
                    } else if (wd.status === 'rejected') {
                        statusClass = 'status-rejected';
                        statusText = '❌ Rejected';
                    } else {
                        statusClass = 'status-pending';
                        statusText = '⏳ Pending';
                    }
                    
                    html += `
                        <div class="list-item">
                            <div>
                                <p><strong>$${wd.amount}</strong></p>
                                <p style="font-size:12px;color:#64748b;"><i class="fab fa-bitcoin"></i> ${wd.btcAddress.substring(0, 20)}...</p>
                                <p style="font-size:12px;color:#64748b;"><i class="far fa-calendar-alt"></i> ${date}</p>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    `;
                });
                div.innerHTML = html;
            });
    }

    // Real-time referrals
    function listenReferrals(userId) {
        db.collection('users').doc(userId).get().then(userDoc => {
            const refCode = userDoc.data().referralCode;
            db.collection('users')
                .where('referredBy', '==', refCode)
                .onSnapshot((snapshot) => {
                    const div = document.getElementById('referralsList');
                    if (snapshot.empty) {
                        div.innerHTML = '<div class="empty-state"><i class="fas fa-user-plus"></i><p>No referrals yet</p><p style="font-size:12px">Share your referral link to earn $0.10 each!</p></div>';
                        return;
                    }
                    
                    let html = '';
                    snapshot.forEach(doc => {
                        const ref = doc.data();
                        html += `
                            <div class="list-item">
                                <div>
                                    <p><strong>${ref.name || ref.email}</strong></p>
                                    <p style="font-size:12px;color:#64748b;"><i class="far fa-calendar-alt"></i> Joined: ${ref.createdAt ? ref.createdAt.toDate().toLocaleDateString() : 'Recently'}</p>
                                </div>
                                <span class="status-badge status-approved">+$0.10</span>
                            </div>
                        `;
                    });
                    div.innerHTML = html;
                });
        });
    }

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            const userRef = db.collection('users').doc(user.uid);
            const userDoc = await userRef.get();
            
            if (!userDoc.exists) {
                await userRef.set({
                    uid: user.uid,
                    name: user.displayName || user.email.split('@')[0],
                    email: user.email,
                    role: 'user',
                    balance: 0,
                    totalEarned: 0,
                    totalSales: 0,
                    totalReferrals: 0,
                    status: 'active',
                    referralCode: user.uid.substring(0, 8),
                    referredBy: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            
            const freshDoc = await userRef.get();
            const userData = freshDoc.data();
            
            document.getElementById('userAvatar').innerHTML = (userData.name || 'U').charAt(0).toUpperCase();
            document.getElementById('userName').innerHTML = userData.name || user.displayName;
            document.getElementById('balance').innerHTML = `$${(userData.balance || 0).toFixed(2)}`;
            document.getElementById('totalEarned').innerHTML = `$${(userData.totalEarned || 0).toFixed(2)}`;
            document.getElementById('referralLink').value = window.location.origin + '/?ref=' + userData.referralCode;
            
            listenUserBalance(user.uid);
            listenSalesHistory(user.uid);
            listenWithdrawHistory(user.uid);
            listenReferrals(user.uid);
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
        }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => {
            if (error.code === 'auth/popup-blocked') {
                alert("Popup blocked! Please allow popups for this site.");
            } else {
                alert("Login failed: " + error.message);
            }
        });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        auth.signOut();
        showToast('Logged out successfully');
    });

    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const tabName = tab.dataset.tab;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(`${tabName}Tab`).classList.add('active');
        });
    });

    // Sell Form
    document.getElementById('sellForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return;

        const gmailEmail = document.getElementById('gmailEmail').value;
        const gmailPassword = document.getElementById('gmailPassword').value;
        
        const btn = document.getElementById('sellBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

        try {
            await db.collection('gmailSales').add({
                userId: currentUser.uid,
                userEmail: currentUser.email,
                gmailEmail: gmailEmail,
                gmailPassword: gmailPassword,
                status: 'pending',
                amount: 1.2,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showToast('✅ Gmail submitted for verification!');
            document.getElementById('sellForm').reset();
        } catch (error) {
            showToast('Error: ' + error.message, true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-rocket"></i> Sell Now - $1.20';
        }
    });

    // Withdraw Form
    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return;

        const address = document.getElementById('btcAddress').value;
        const amount = parseFloat(document.getElementById('withdrawAmount').value);

        if (amount < 29) {
            showToast('Minimum withdrawal is $29!', true);
            return;
        }
        
        const userDoc = await db.collection('users').doc(currentUser.uid).get();
        const currentBalance = userDoc.data().balance || 0;
        
        if (amount > currentBalance) {
            showToast('Insufficient balance!', true);
            return;
        }

        const btn = document.getElementById('withdrawBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

        try {
            await db.collection('withdrawals').add({
                userId: currentUser.uid,
                userEmail: currentUser.email,
                btcAddress: address,
                amount: amount,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showToast('Withdrawal request submitted!');
            document.getElementById('withdrawForm').reset();
        } catch (error) {
            showToast('Error: ' + error.message, true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Request Withdrawal';
        }
    });

    document.getElementById('copyLinkBtn').addEventListener('click', () => {
        const input = document.getElementById('referralLink');
        input.select();
        document.execCommand('copy');
        showToast('Referral link copied!');
    });
</script>
</body>
</html>
